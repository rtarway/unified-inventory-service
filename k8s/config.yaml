apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
data:
  NODE_ENV: "production"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BROKERS: "kafka:9092"
  # Comma-separated browser origins when clients call the API directly; omit for same-origin only (origin: false)
  # CORS_ORIGINS: "https://app.example.com"
