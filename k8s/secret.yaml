# Replace placeholder values before applying to any real cluster.
# Apply before postgres.yaml and deployment.yaml so DATABASE_URL and DB credentials exist.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
type: Opaque
stringData:
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "dev-only-change-me"
  DATABASE_URL: "postgresql://admin:dev-only-change-me@postgres:5432/inventory_future"
  # Optional: require Authorization: Bearer <token> on all routes except /health
  # API_TOKEN: "your-secret-token"
